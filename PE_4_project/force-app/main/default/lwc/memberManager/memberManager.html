<template>
    <div class="manager-container">
        <!-- ─── TOOLBAR ─── -->
        <div class="toolbar">
            <div class="toolbar-left">
                <h2 class="section-heading">
                    <lightning-icon icon-name="utility:people" size="x-small"></lightning-icon>
                    &nbsp;Library Members
                </h2>
                <span class="record-count">{memberCount} members</span>
            </div>
            <div class="toolbar-right">
                <lightning-input type="search" placeholder="Search by name or email…"
                                 value={searchKey} onchange={handleSearch}
                                 class="search-input"></lightning-input>
                <lightning-button label="Add Member" variant="brand" icon-name="utility:add"
                                  onclick={openAddModal} class="add-btn"></lightning-button>
            </div>
        </div>

        <!-- ─── MEMBERS TABLE ─── -->
        <div class="table-wrap">
            <template if:true={hasMembers}>
                <lightning-datatable
                    key-field="Id"
                    data={filteredMembers}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}
                    show-row-number-column>
                </lightning-datatable>
            </template>
            <template if:false={hasMembers}>
                <div class="empty-state">
                    <lightning-icon icon-name="utility:people" size="large"></lightning-icon>
                    <p>No members found. Click <strong>Add Member</strong> to register a new member.</p>
                </div>
            </template>
        </div>

        <!-- ─── ADD / EDIT MODAL ─── -->
        <template if:true={showModal}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        </button>
                        <h2 class="slds-modal__title">{modalTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_large">
                        <lightning-record-edit-form object-api-name="Library_Member__c" record-id={editRecordId}
                                                     onsuccess={handleSaveSuccess} onerror={handleSaveError}>
                            <div class="form-grid">
                                <lightning-input-field field-name="Name"></lightning-input-field>
                                <lightning-input-field field-name="Email__c"></lightning-input-field>
                                <lightning-input-field field-name="Phone__c"></lightning-input-field>
                                <lightning-input-field field-name="Membership_Date__c"></lightning-input-field>
                                <lightning-input-field field-name="Membership_Status__c"></lightning-input-field>
                                <lightning-input-field field-name="Books_Issued__c"></lightning-input-field>
                                <lightning-input-field field-name="Address__c" class="full-width"></lightning-input-field>
                            </div>
                            <div class="modal-actions">
                                <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                                <lightning-button label="Save" variant="brand" type="submit"></lightning-button>
                            </div>
                        </lightning-record-edit-form>
                    </div>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
